name: Hybrid embodied-amodal validation

on:
  pull_request:
    branches: [main]
    paths:
      - "ore_hybrid_embodied_amodal/**"
      - "tests/test_hybrid_embodied_amodal.py"
      - "ore_logger/**"
  push:
    branches: [feat/hybrid-embodied-amodal-19-stage]
    paths:
      - "ore_hybrid_embodied_amodal/**"
      - "tests/test_hybrid_embodied_amodal.py"
      - "ore_logger/**"

concurrency:
  group: hybrid-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-hybrid-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused hybrid tests
        run: python -m pytest -q tests/test_hybrid_embodied_amodal.py
