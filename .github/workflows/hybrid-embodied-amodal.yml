name: Hybrid embodied-amodal validation

on:
  pull_request:
    branches: [main]
    paths:
      - "ore_hybrid_embodied_amodal/**"
      - "tests/test_hybrid_embodied_amodal.py"
      - "ore_logger/**"
      - "pyproject.toml"
      - ".github/workflows/hybrid-embodied-amodal.yml"
  push:
    branches: [feat/hybrid-embodied-amodal-19-stage]
    paths:
      - "ore_hybrid_embodied_amodal/**"
      - "tests/test_hybrid_embodied_amodal.py"
      - "ore_logger/**"
      - "pyproject.toml"
      - ".github/workflows/hybrid-embodied-amodal.yml"

permissions:
  contents: read

jobs:
  focused-hybrid-tests:
    runs-on: ubuntu-latest
    # Prevent a stalled test process from occupying a hosted runner indefinitely.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-timeout
      - name: Run hybrid embodied-amodal tests with per-test timeout
        run: |
          python -m pytest tests/test_hybrid_embodied_amodal.py -q \
            --timeout=60 --durations=10
