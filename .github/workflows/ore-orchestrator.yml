name: ORE Orchestrator Tests

on:
  pull_request:
    paths:
      - "ore_orchestrator/**"
      - "tests/test_master_orchestrator.py"
      - "experiment_workbench/adapter.py"
      - "experiment_workbench/auto_test.py"
      - "experiment_workbench/app.py"
      - "experiment_workbench/observer.py"
      - "experiment_workbench/README.md"
      - "tests/test_workbench_randomized_contracts.py"
      - "pyproject.toml"
      - ".github/workflows/ore-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check orchestrator code
        run: python -m ruff check ore_orchestrator tests/test_master_orchestrator.py
      - name: Run orchestrator integration tests
        run: python -m pytest -q tests/test_master_orchestrator.py

  workbench-randomized-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check Workbench changes
        run: python -m ruff check experiment_workbench/adapter.py experiment_workbench/auto_test.py experiment_workbench/app.py experiment_workbench/observer.py tests/test_workbench_randomized_contracts.py
      - name: Run randomized Workbench regression tests
        run: python -m pytest -q tests/test_workbench_randomized_contracts.py tests/test_workbench_adapter.py tests/test_workbench_narration.py tests/test_workbench_observer.py tests/test_workbench_randomized_output_paths.py
