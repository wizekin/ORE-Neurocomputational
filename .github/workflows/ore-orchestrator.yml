name: ORE Orchestrator Tests

on:
  pull_request:
    paths:
      - "ore_orchestrator/**"
      - "tests/test_master_orchestrator.py"
      - "pyproject.toml"
      - ".github/workflows/ore-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check orchestrator code
        run: python -m ruff check ore_orchestrator tests/test_master_orchestrator.py
      - name: Run orchestrator integration tests
        run: python -m pytest -q tests/test_master_orchestrator.py
