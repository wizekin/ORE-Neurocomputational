name: Python tests

# Temporarily disabled during ORE-USG integration.
# Restore push/pull_request triggers when local testing is ready to resume.
on:
  workflow_dispatch:
    inputs: {}

jobs:
  test:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
