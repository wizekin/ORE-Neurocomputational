name: tests

# Kept available for intentional manual runs. The full test suite is run by
# python-tests.yml, so this workflow must not duplicate every push and PR.
on:
  workflow_dispatch:

concurrency:
  group: manual-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
