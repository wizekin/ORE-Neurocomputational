name: USG Phase 2 tests

on:
  push:
    branches: ["feature/phase2-usg-semantic-integration-20261126"]
  pull_request:
    branches: [main]

concurrency:
  group: usg-phase2-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  usg-phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_usg_processor_bridges.py tests/test_usg_knowledge_adapter.py tests/test_usg_structure_adapter.py tests/test_usg_semantic_adapter.py -q
